<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trình Tạo Lưới In Cắt A4 (4x3cm) - 4 Dòng</title>
    <style>
      /* CSS cho giao diện trên màn hình */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .controls {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
        margin-bottom: 20px;
      }
      textarea {
        width: 100%;
        height: 150px;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 10px;
        font-family: monospace;
        resize: vertical;
      }
      .btn-group button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        color: white;
      }
      .btn-generate {
        background-color: #4caf50;
      }
      .btn-print {
        background-color: #008cba;
      }

      /* CSS dành riêng cho bản in và khung 4x3cm */
      #printZone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .page {
        width: 210mm;
        height: 297mm;
        background: white;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        padding: 13.5mm 5mm;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(5, 40mm);
        grid-template-rows: repeat(9, 30mm);
      }
      .cell {
        width: 40mm;
        height: 30mm;
        border: 0.5px solid black;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12pt; /* Cỡ chữ 12pt để vừa vặn 4 dòng trong 3cm */
        font-family: "Times New Roman", serif;
        word-wrap: break-word;
        padding: 1mm;
        overflow: hidden;
        line-height: 1.15; /* Khoảng cách dòng hẹp lại để tiết kiệm diện tích */
      }

      /* Dùng chung 1 định dạng cho mọi dòng */
      .hs-line {
        margin-bottom: 1px;
        font-weight: normal;
        font-style: normal;
      }

      @media print {
        body {
          background: none;
          padding: 0;
        }
        .controls {
          display: none;
        }
        #printZone {
          gap: 0;
        }
        .page {
          box-shadow: none;
          page-break-after: always;
        }
        @page {
          size: A4;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h2>Nhập Dữ Liệu (Học sinh - 4 Dòng)</h2>
      <p>
        Nhập thông tin theo cấu trúc: <b>Tên | Số đo | Trường lớp | Loại áo</b>.
        Nhấn Enter để xuống dòng cho học sinh tiếp theo.
      </p>
      <textarea
        id="dataInput"
        placeholder="Nguyễn Văn A | 24.24.24 | 12A1 | Cộc tay
Trần Thị B | 15.15.15 | THPT Lê Quý Đôn | Dài tay
Lê Văn C | 20.20.20 | Lớp 10A2 | Cộc"
      ></textarea>
      <div class="btn-group">
        <button class="btn-generate" onclick="generateGrid()">Tạo Lưới</button>
        <button class="btn-print" onclick="window.print()">
          In / Xuất PDF
        </button>
      </div>
    </div>

    <div id="printZone"></div>

    <script>
      function generateGrid() {
        const rawData = document.getElementById("dataInput").value;
        const dataList = rawData
          .split("\n")
          .map((item) => item.trim())
          .filter((item) => item !== "");

        const printZone = document.getElementById("printZone");
        printZone.innerHTML = "";

        const cellsPerPage = 45;
        const totalPages = Math.ceil(dataList.length / cellsPerPage) || 1;

        for (let p = 0; p < totalPages; p++) {
          const page = document.createElement("div");
          page.className = "page";

          for (let i = 0; i < cellsPerPage; i++) {
            const dataIndex = p * cellsPerPage + i;
            const cell = document.createElement("div");
            cell.className = "cell";

            if (dataIndex < dataList.length) {
              // Tách 4 thông tin dựa vào dấu |
              const parts = dataList[dataIndex].split("|").map((p) => p.trim());

              let htmlContent = "";
              if (parts[0])
                htmlContent += `<div class="hs-line">${parts[0]}</div>`;
              if (parts[1])
                htmlContent += `<div class="hs-line">${parts[1]}</div>`;
              if (parts[2])
                htmlContent += `<div class="hs-line">${parts[2]}</div>`;
              if (parts[3])
                htmlContent += `<div class="hs-line">${parts[3]}</div>`; /* Dòng thứ 4 cho loại áo */

              cell.innerHTML = htmlContent;
            }

            page.appendChild(cell);
          }
          printZone.appendChild(page);
        }
      }

      window.onload = generateGrid;
    </script>
  </body>
</html>
